name: Build app de escritorio

# Compila los instaladores nativos de Formula Care en Linux, Windows y macOS.
#
# - Con un tag "v*" (p. ej. v0.2.0): compila las tres plataformas y crea un
#   borrador de release en GitHub con los instaladores adjuntos.
# - Manual (workflow_dispatch): compila las tres plataformas sin publicar
#   ningún release, solo para comprobar que el build sigue funcionando.
#
# Actualizaciones automáticas: si el repositorio tiene los secretos
# TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD, cada
# instalador se firma para el actualizador (.sig) y el release lleva un
# latest.json, que es lo que consulta la app instalada. Sin esos secretos el
# build funciona igual, pero sin actualizaciones automáticas.
#
# Esa firma solo sirve para que la app compruebe que la actualización es
# auténtica; NO es la firma de código de Windows/macOS (de pago), que queda
# fuera del proyecto: por eso el sistema avisa de "editor desconocido".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      # Hace falta contents:write para que tauri-action pueda crear/actualizar
      # el borrador de release y subirle los instaladores en un push de tag.
      # El GITHUB_TOKEN por defecto en este repo es de solo lectura.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    env:
      # 'true' si el repositorio tiene la clave para firmar las actualizaciones
      HAY_CLAVE_ACTUALIZACIONES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias nativas de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear el build de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar dependencias del backend
        run: npm --prefix backend ci

      - name: Compilar backend y generar la plantilla de base de datos
        working-directory: backend
        run: npm run build:desktop
        env:
          # Solo hace falta para que `prisma generate` tenga un valor de
          # DATABASE_URL válido al leer el schema; el script de la plantilla
          # usa su propio fichero temporal internamente.
          DATABASE_URL: "file:./ci-placeholder.db"

      - name: Quitar dependencias de desarrollo del backend empaquetado
        # backend/node_modules se copia entero al instalador: sin tipos,
        # TypeScript ni tsx (el CLI de prisma sí se queda, hace falta para migrar)
        run: npm --prefix backend prune --omit=dev

      - name: Descargar el runtime de Node.js como sidecar
        run: npm run predesktop:node-sidecar

      - name: Compilar y empaquetar la app de escritorio
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Con clave, genera además los archivos firmados del actualizador
          args: ${{ env.HAY_CLAVE_ACTUALIZACIONES == 'true' && '--config src-tauri/tauri.actualizaciones.conf.json' || '' }}
          # tagName vacío en workflow_dispatch le indica a tauri-action que
          # compile sin crear ni tocar ningún release (solo en un push de
          # tag "v*" hay tagName real y se crea el borrador).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Formula Care ${{ github.ref_name }}"
          releaseBody: |
            Instaladores generados automáticamente para esta versión.
            Descarga el que corresponda a tu sistema operativo.
          releaseDraft: true
          prerelease: false
          # latest.json para la app instalada (solo tiene contenido con clave).
          # Lleva una entrada por tipo de instalador, así quien instaló con el
          # .msi se actualiza con el .msi y quien usó el .exe, con el .exe.
          includeUpdaterJson: ${{ env.HAY_CLAVE_ACTUALIZACIONES == 'true' }}
          updaterJsonPreferNsis: true

      - name: Subir instaladores como artefacto del run (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: formula-care-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
